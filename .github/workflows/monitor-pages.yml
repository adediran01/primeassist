name: Monitor GitHub Pages HTTPS

on:
  schedule:
    - cron: '0 9 * * *' # daily at 09:00 UTC
  workflow_dispatch: {}

jobs:
  check-pages:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Check Pages HTTPS and open issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pages = await github.rest.repos.getPages({ owner, repo });
            const cname = pages.data.cname || 'not set';
            const httpsEnabled = pages.data.https_enforced === true;
            const title = `HTTPS enabled for ${cname}`;
            if (httpsEnabled) {
              // Avoid duplicate open issues with same title
              const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open' });
              const exists = issues.find(i => i.title === title);
              if (!exists) {
                await github.rest.issues.create({ owner, repo, title, body: `GitHub Pages reports HTTPS is now enforced for ${cname}. Visit https://${cname} to verify.` });
              } else {
                core.info('HTTPS issue already exists.');
              }
            } else {
              core.info(`HTTPS not yet enabled for ${cname}.`);
            }